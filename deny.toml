[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "workspace"
unused-ignored-advisory = "deny"

[licenses]
confidence-threshold = 0.93
unused-allowed-license = "deny"
allow = [
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
# Workspace path dependencies intentionally inherit their version from the
# workspace package and appear as wildcards to cargo-deny. Registry dependency
# versions remain centralized and pinned in the root Cargo.toml/Cargo.lock.
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
