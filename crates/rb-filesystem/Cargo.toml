[package]
name = "rb-filesystem"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "rust-backup filesystem module"

[dependencies]
rb-core = { path = "../rb-core" }
async-trait.workspace = true
blake3.workspace = true
# `resource` is read by the walk's descriptor-budget test only: it lowers
# RLIMIT_NOFILE so a tree deeper than the limit proves the walk holds no
# directory descriptor across its recursion.
nix = { workspace = true, features = ["fs", "resource", "user"] }
tracing.workspace = true
serde = { workspace = true }
serde_json.workspace = true
tokio = { workspace = true }

# Phase 2: nix = "0.29" (Unix syscalls for stat, xattr, chown); walkdir = "2.4" (recursive traversal)
