# Mixed multi-target session. Replace every CHANGE_ME and hostname before use.
# All four peers run concurrently; each channel has one source and destination.
parallel_targets: 4
fail_fast: true
targets:
  - module: postgres
    role: source
    transport: { to: coordinator.example:7835, channel: pg-prod, secret: CHANGE_ME, udp: true }
    params:
      host: postgres-source.internal
      port: 5432
      user: backup_readonly
      password: CHANGE_ME
      database: app
      sslmode: require

  - module: postgres
    role: destination
    transport: { to: coordinator.example:7835, channel: pg-prod, secret: CHANGE_ME, udp: true }
    params:
      host: postgres-destination.internal
      port: 5432
      user: postgres
      password: CHANGE_ME
      database: postgres
      sslmode: require
      admin: true
      overwrite: false
    auto_accept: true

  - module: filesystem
    role: source
    transport: { to: coordinator.example:7835, channel: fs-home, secret: CHANGE_ME, carriers: 4, udp: true }
    params:
      root: /srv/home
      preserve_ownership: true

  - module: filesystem
    role: destination
    transport: { to: coordinator.example:7835, channel: fs-home, secret: CHANGE_ME, carriers: 4, udp: true }
    params:
      root: /restore/home
      preserve_ownership: true
    auto_accept: true
