name: Fast release

# The tag path, optimised for wall clock: it compiles the binary once per
# architecture on a native runner with a warm cargo cache and publishes the
# archives. Nothing else.
#
# What it deliberately does NOT run, because the tagged commit has already
# passed the full gate on `dev` (fmt, clippy, unit tests, e2e, CodeQL, cargo
# audit/deny, zizmor): the container image, its validation build, the Trivy
# scan, SBOM and provenance. Those still run on every branch push through
# `ci.yml`, `e2e.yml`, `security.yml` and `docker.yml`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: amd64
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Ignored for this workflow in `.github/zizmor.yml` (cache-poisoning).
      # A release-triggered workflow that caches build state is what that audit
      # warns about. The trade is taken knowingly and bounded: the key is the
      # exact `Cargo.lock`, the cache holds only the dependency registry and
      # `target/`, and the published artifact is built from a fresh checkout of
      # the tagged commit with `--locked`. Without it this is a cold ten-minute
      # compile per architecture, which is the whole point of the workflow.
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: fast-release-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            fast-release-${{ runner.os }}-${{ matrix.arch }}-

      - name: Check that the tag matches the crate version
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          crate_version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if [[ "$GITHUB_REF_NAME" != "v${crate_version}" ]]; then
            echo "tag $GITHUB_REF_NAME does not match the crate version $crate_version" >&2
            exit 1
          fi

      - name: Build the release binary
        run: cargo build --locked --release --all-features --bin rust-backup

      - name: Smoke-test the binary
        run: ./target/release/rust-backup --version

      - name: Package the archive and its checksum
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          base_version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="${base_version}-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}"
          fi
          package="rust-backup-${version}-${TARGET}"
          mkdir -p "dist/$package"
          install -m 0755 target/release/rust-backup "dist/$package/rust-backup"
          cp README.md CHANGELOG.md LICENSE "dist/$package/"
          tar -C dist -czf "dist/$package.tar.gz" "$package"
          (cd dist && sha256sum "$package.tar.gz" > "$package.tar.gz.sha256")
          rm -rf "dist/$package"

      - name: Upload the archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fast-archive-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish the GitHub release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # Create the tag's release and upload its assets.
    steps:
      - name: Download the archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          pattern: fast-archive-*
          merge-multiple: true
      - name: Build the aggregate checksums
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum ./*.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          # This job never checks the repository out, so `gh` has no git remote
          # to infer the repository from.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" == 0.* || "$version" == *-* ]]; then
            prerelease=true
          else
            prerelease=false
          fi
          echo "publishing $GITHUB_REF_NAME (prerelease=$prerelease)"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
            gh release edit "$GITHUB_REF_NAME" --prerelease="$prerelease"
          else
            args=(release-assets/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME")
            if [[ "$prerelease" == true ]]; then
              args+=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" "${args[@]}"
          fi
