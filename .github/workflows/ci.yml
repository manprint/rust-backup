name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  rust-quality:
    name: Rust quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-ci-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-ci-

      - name: Run the repository gate
        run: bash scripts/gates.sh

      - name: Test relay-only feature set
        run: cargo test --workspace --locked --no-default-features

      - name: Build documentation with warnings denied
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --locked --all-features --no-deps

  portability:
    name: Build ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: all-features-release
            args: --release --all-features
          - profile: relay-only-release
            args: --release --no-default-features
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-build-${{ hashFiles('Cargo.lock') }}
      - name: Build workspace
        env:
          BUILD_ARGS: ${{ matrix.args }}
        run: |
          read -r -a args <<< "$BUILD_ARGS"
          cargo build --workspace --locked "${args[@]}"

  repository-lint:
    name: Shell, YAML and workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate shell syntax
        run: |
          set -euo pipefail
          for script in e2e/*.sh scripts/*.sh; do
            bash -n "$script"
          done
      - name: ShellCheck
        run: |
          docker run --rm \
            -v "$PWD:/repo" -w /repo \
            koalaman/shellcheck:v0.11.0 \
            --severity=warning e2e/*.sh scripts/*.sh
      - name: actionlint
        run: |
          docker run --rm \
            -v "$PWD:/repo" -w /repo \
            rhysd/actionlint:1.7.12
      - name: Validate Compose rendering
        env:
          RUST_BACKUP_SECRET_FILE: deploy/coordination/coordination.secret.example
        run: docker compose -f compose.yml config --quiet
