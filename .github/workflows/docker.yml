name: Container image

on:
  push:
    branches: [dev, main]
    tags: ["v*"]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  validate:
    name: Build, smoke-test and scan image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build local validation image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          tags: rust-backup:ci
          build-args: |
            VERSION=ci-${{ github.sha }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=container-validation
          cache-to: type=gha,mode=max,scope=container-validation
      - name: Validate CLI and non-root runtime
        run: |
          set -euo pipefail
          docker run --rm rust-backup:ci --help >/dev/null
          test "$(docker run --rm --entrypoint=id rust-backup:ci -u)" = "65532"
      - name: Smoke-test coordination server
        run: |
          set -euo pipefail
          cid=$(docker run -d -p 17835:7835/tcp rust-backup:ci server --udp=false)
          trap 'docker logs "$cid"; docker rm -f "$cid" >/dev/null' EXIT
          for _attempt in $(seq 1 30); do
            if nc -z 127.0.0.1 17835; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Scan image for critical vulnerabilities
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            aquasec/trivy:0.72.0 image \
            --exit-code 1 --ignore-unfixed --severity CRITICAL \
            rust-backup:ci

  publish:
    name: Publish multi-architecture image
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read # Checkout source for the image build.
      packages: write # Push the image and attestations to GHCR.
      id-token: write # Request the OIDC identity used for provenance.
      attestations: write # Publish GitHub build provenance.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build and push linux/amd64 and linux/arm64
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=container-publish
          cache-to: type=gha,mode=max,scope=container-publish
          provenance: mode=max
          sbom: true
      - name: Attest registry image
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
