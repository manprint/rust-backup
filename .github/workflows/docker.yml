name: Container image

on:
  push:
    branches: [dev, main]
    tags: ["v*"]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  validate:
    name: Build, smoke-test and scan image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build local validation image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          tags: rust-backup:ci
          build-args: |
            VERSION=ci-${{ github.sha }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=container-validation
          cache-to: type=gha,mode=max,ignore-error=true,scope=container-validation
      - name: Validate CLI and non-root runtime
        run: |
          set -euo pipefail
          docker run --rm rust-backup:ci --help >/dev/null
          test "$(docker run --rm --entrypoint=id rust-backup:ci -u)" = "65532"
      - name: Smoke-test coordination server
        run: |
          set -euo pipefail
          cid=$(docker run -d -p 17835:7835/tcp rust-backup:ci server --udp=false)
          trap 'docker logs "$cid"; docker rm -f "$cid" >/dev/null' EXIT
          for _attempt in $(seq 1 30); do
            if nc -z 127.0.0.1 17835; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Scan image for critical vulnerabilities
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            aquasec/trivy:0.72.0 image \
            --exit-code 1 --ignore-unfixed --severity CRITICAL \
            rust-backup:ci

  publish-platform:
    name: Publish ${{ matrix.platform }} image
    if: github.event_name == 'push'
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-22.04
            artifact: amd64
          - platform: linux/arm64
            runner: ubuntu-22.04-arm
            artifact: arm64
    permissions:
      contents: read # Checkout source for the image build.
      packages: write # Push the platform-specific manifest to GHCR.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
      - name: Build and push ${{ matrix.platform }} by digest
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=container-publish-${{ matrix.artifact }}
          cache-to: type=gha,mode=max,ignore-error=true,scope=container-publish-${{ matrix.artifact }}
          provenance: mode=max
          sbom: true
      - name: Export image digest
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p /tmp/digests
          touch "/tmp/digests/${IMAGE_DIGEST#sha256:}"
      - name: Upload image digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: container-digest-${{ matrix.artifact }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-manifest:
    name: Publish multi-architecture manifest
    if: github.event_name == 'push'
    needs: publish-platform
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # Publish the image index and tags to GHCR.
      id-token: write # Request the OIDC identity used for provenance.
      attestations: write # Publish GitHub build provenance.
    steps:
      - name: Download image digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: /tmp/digests
          pattern: container-digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Create multi-architecture manifest
        id: manifest
        env:
          IMAGE_VERSION: ${{ steps.meta.outputs.version }}
          TAGS_JSON: ${{ steps.meta.outputs.json }}
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          mapfile -t tags < <(jq -r '.tags[]' <<<"$TAGS_JSON")
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=(--tag "$tag")
          done
          sources=()
          for platform_digest in *; do
            [[ "$platform_digest" =~ ^[0-9a-f]{64}$ ]]
            sources+=("$IMAGE_NAME@sha256:$platform_digest")
          done
          [[ ${#sources[@]} -eq 2 ]]
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          digest=$(docker buildx imagetools inspect \
            "$IMAGE_NAME:$IMAGE_VERSION" \
            --format '{{ .Manifest.Digest }}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
      - name: Attest registry image
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
